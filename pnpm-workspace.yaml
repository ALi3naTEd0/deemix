packages:
  - packages/*

blockExoticSubdeps: false
nodeLinker: "hoisted"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  utf-8-validate: true
  vue-demi: true

overrides:
  # extract-zip 2.0.1 (used by @electron/packager) hangs on Node >= 26 with
  # yauzl 2.x: unpacking the Electron zip stops early and never resolves
  yauzl: ^3.2.0
